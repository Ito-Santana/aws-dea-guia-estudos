<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">AWS</span>
          <span class="brand-text">
            <strong>{{ site.title }}</strong>
            <small>{{ site.description }}</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Principal">
          <a href="{{ '/' | relative_url }}">Início</a>
          <a href="{{ '/fundamentos-engenharia-de-dados/conceitos-basicos.html' | relative_url }}">Conceitos</a>
          <a href="{{ '/fundamentos-engenharia-de-dados/lakes-vs-warehouse.html' | relative_url }}">Lake vs Warehouse</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="shell content-panel">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <p>Guia de estudos focado em engenharia de dados na AWS.</p>
      </div>
    </footer>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: true,
        theme: "neutral",
        securityLevel: "loose"
      });
    </script>
  </body>
</html>
